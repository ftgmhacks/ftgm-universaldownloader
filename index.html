<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FTGM Universal Media Downloader</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- System Fonts Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* Modern CSS Variables */
    :root {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --input-bg: #f9fafb;
      
      --accent: #4f46e5; /* Indigo */
      --accent-hover: #4338ca;
      --accent-glow: rgba(79, 70, 229, 0.4);
      
      --success: #10b981;
      --danger: #ef4444;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-full: 9999px;
    }

    /* Dark Mode Optimization */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: #334155;
        --input-bg: #0f172a;
        --accent: #6366f1;
        --accent-hover: #4f46e5;
        --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      flex: 1;
    }

    /* Keyframe Animations */
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseSoft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .animate-up {
      opacity: 0;
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }

    /* Header & Branding */
    header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-icon {
      font-size: 2.5rem;
      color: var(--accent);
      margin-bottom: 10px;
      filter: drop-shadow(0 4px 6px var(--accent-glow));
    }

    /* GRADIENT TITLE THEME */
    .brand-title {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #4f46e5, #ec4899, #f43f5e, #f59e0b);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      animation: gradientShift 4s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Platform Icons Grid */
    .platforms {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .platform-chip {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 50px;
      border-radius: var(--radius-md);
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      font-size: 1.5rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: default;
    }

    .platform-chip:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: var(--shadow-md);
      border-color: var(--accent);
    }

    .icon-tiktok { color: #fe2c55; }
    .icon-instagram { color: #e1306c; }
    .icon-facebook { color: #1877f2; }
    .icon-youtube { color: #ff0000; }

    /* Search Container */
    .search-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-lg);
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border-radius: var(--radius-md);
      border: 2px solid var(--border-color);
      transition: all 0.3s ease;
    }

    .input-wrapper:focus-within {
      border-color: var(--accent);
      background: var(--card-bg);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }

    .input-wrapper .fa-link {
      position: absolute;
      left: 16px;
      color: var(--text-muted);
      font-size: 1.1rem;
      transition: color 0.3s ease;
    }
    
    .input-wrapper:focus-within .fa-link {
      color: var(--accent);
    }

    .input-field {
      width: 100%;
      padding: 16px 52px 16px 44px;
      background: transparent;
      border: none;
      outline: none;
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-main);
    }

    .input-field::placeholder {
      color: var(--text-muted);
    }

    .btn-action-input {
      position: absolute;
      right: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      cursor: pointer;
      font-size: 1rem;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    .btn-action-input:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-action-input.clear-mode:hover {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }

    .btn-fetch {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .btn-fetch:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px var(--accent-glow);
      background: linear-gradient(135deg, var(--accent-hover), #6d28d9);
    }

    /* LOADING PROCESSING CONTAINER */
    .loading-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 30px;
      box-shadow: var(--shadow-lg);
      margin-bottom: 24px;
      display: none; /* toggled via JS */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      text-align: center;
    }

    .loading-card.show {
      display: flex;
      animation: fadeInUp 0.4s ease forwards;
    }

    .processing-gif {
      width: 130px;
      border-radius: 12px;
      mix-blend-mode: multiply; /* Removes white background if light theme */
    }
    
    @media (prefers-color-scheme: dark) {
      .processing-gif {
        mix-blend-mode: normal; /* Maintain as is on dark mode */
      }
    }

    .processing-text {
      font-size: 1.1rem;
      font-weight: 800;
      background: linear-gradient(135deg, #4f46e5, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulseSoft 1.5s infinite ease-in-out;
    }

    /* Result Card */
    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-lg);
      margin-bottom: 24px;
      display: none; 
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .result-card.show {
      opacity: 1;
      transform: translateY(0);
    }

    .media-preview-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (min-width: 480px) {
      .media-preview-container {
        flex-direction: row;
        align-items: flex-start;
      }
    }

    .media-thumb {
      width: 100%;
      max-width: 140px;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-md);
      object-fit: cover;
      background: var(--border-color);
      flex-shrink: 0;
      box-shadow: var(--shadow-md);
    }

    .media-info {
      flex: 1;
      width: 100%;
    }

    .media-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.5;
      margin-bottom: 12px;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .btn-copy-caption {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-copy-caption:hover {
      background: var(--border-color);
    }

    /* Improved Download Formats List */
    .formats-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }

    .btn-save {
      width: 100%;
      background: var(--input-bg);
      color: var(--text-main);
      border: 2px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .btn-save:hover {
      border-color: var(--accent);
      background: rgba(79, 70, 229, 0.05);
      color: var(--accent);
      box-shadow: var(--shadow-sm);
    }

    .btn-save i {
      color: var(--accent);
      transition: transform 0.2s ease;
    }

    .btn-save:hover i {
      transform: translateY(2px);
    }

    .btn-save.preparing {
      background: var(--border-color);
      color: var(--text-muted);
      border-color: transparent;
      cursor: wait;
      pointer-events: none;
    }

    .ext-badge {
      background: var(--border-color);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--text-main);
    }

    /* WhatsApp Banner */
    .whatsapp-card {
      background: linear-gradient(135deg, #128C7E, #25D366);
      color: #ffffff;
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      box-shadow: 0 10px 20px rgba(37, 211, 102, 0.25);
      margin-bottom: 30px;
      transition: all 0.3s ease;
    }

    .whatsapp-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 25px rgba(37, 211, 102, 0.35);
    }

    .wa-content {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .wa-icon {
      font-size: 2.2rem;
    }

    .wa-text h4 {
      font-size: 1rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .wa-text p {
      font-size: 0.85rem;
      opacity: 0.95;
      font-weight: 500;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text-main);
      color: var(--bg-color);
      padding: 12px 24px;
      border-radius: var(--radius-full);
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      width: 100%;
    }

    .spinner {
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="animate-up">
      <div class="logo-wrapper">
         <i class="fa-solid fa-bolt logo-icon"></i>
      </div>
      <!-- Gradient applied to the full title text natively -->
      <h1 class="brand-title">FTGM DOWNLOADER</h1>
      <p class="subtitle">Download High-Quality Videos Fast & Free</p>
    </header>

    <!-- Platform Icons -->
    <div class="platforms animate-up delay-1">
      <div class="platform-chip"><i class="fa-brands fa-tiktok icon-tiktok"></i></div>
      <div class="platform-chip"><i class="fa-brands fa-instagram icon-instagram"></i></div>
      <div class="platform-chip"><i class="fa-brands fa-facebook icon-facebook"></i></div>
      <div class="platform-chip"><i class="fa-brands fa-youtube icon-youtube"></i></div>
    </div>

    <!-- Search Section (Stacked layout) -->
    <div class="search-card animate-up delay-2">
      <div class="input-wrapper">
        <i class="fa-solid fa-link"></i>
        <input type="text" id="urlInput" class="input-field" placeholder="Paste your video link here..." autocomplete="off">
        <button id="inputActionBtn" class="btn-action-input" title="Paste Link">
          <i class="fa-regular fa-clipboard" id="actionIcon"></i>
        </button>
      </div>
      
      <button id="fetchBtn" class="btn-fetch">
        <i class="fa-solid fa-arrow-down-long"></i>
        <span>Fetch Media</span>
      </button>
    </div>

    <!-- Processing Animation Card -->
    <div id="loadingCard" class="loading-card">
      <!-- Your requested animated WebP/GIF File -->
      <img src="https://block.youtest.me/static/assets/img/ques_images/297/header.webp" alt="Processing" class="processing-gif">
      <p class="processing-text">Extracting Video Links...</p>
    </div>

    <!-- Result Card -->
    <div id="resultCard" class="result-card">
      <div class="media-preview-container">
        <img id="mediaThumb" class="media-thumb" src="" alt="Thumbnail">
        <div class="media-info">
          <!-- media-title now allows full text wrapping -->
          <div id="mediaTitle" class="media-title"></div>
          <button id="copyCaptionBtn" class="btn-copy-caption">
            <i class="fa-regular fa-copy"></i> Copy Full Caption
          </button>
        </div>
      </div>
      <div id="formatsList" class="formats-list"></div>
    </div>

    <!-- WhatsApp CTA -->
    <a href="https://whatsapp.com/channel/0029VbDQFi9KmCPUDQEwVW2W" target="_blank" class="whatsapp-card animate-up delay-3">
      <div class="wa-content">
        <i class="fa-brands fa-whatsapp wa-icon"></i>
        <div class="wa-text">
          <h4>Join Official WhatsApp Channel</h4>
          <p>Get instant updates & exclusive tools</p>
        </div>
      </div>
      <i class="fa-solid fa-chevron-right"></i>
    </a>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast">
    <i class="fa-solid fa-circle-check" style="color:var(--success);"></i>
    <span id="toastMsg">Action successful!</span>
  </div>

  <!-- Footer -->
  <footer class="animate-up delay-3">
    FTGM TOOLS &copy; 2026. All rights reserved.
  </footer>

  <script>
    const urlInput = document.getElementById('urlInput');
    const inputActionBtn = document.getElementById('inputActionBtn');
    const actionIcon = document.getElementById('actionIcon');
    const fetchBtn = document.getElementById('fetchBtn');
    const resultCard = document.getElementById('resultCard');
    const loadingCard = document.getElementById('loadingCard');
    const mediaThumb = document.getElementById('mediaThumb');
    const mediaTitle = document.getElementById('mediaTitle');
    const copyCaptionBtn = document.getElementById('copyCaptionBtn');
    const formatsList = document.getElementById('formatsList');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');

    let currentTitleText = '';
    let toastTimeout;

    // Toast Notification System
    function showToast(msg, isError = false) {
      clearTimeout(toastTimeout);
      toastMsg.innerText = msg;
      
      const icon = toast.querySelector('i');
      if (isError) {
        icon.className = 'fa-solid fa-circle-exclamation';
        icon.style.color = 'var(--danger)';
      } else {
        icon.className = 'fa-solid fa-circle-check';
        icon.style.color = 'var(--success)';
      }
      
      toast.classList.add('show');
      toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Input state checker to switch between Paste and Clear(Cut) icons
    function checkInputState() {
      if (urlInput.value.trim() !== '') {
        actionIcon.className = 'fa-solid fa-xmark';
        inputActionBtn.title = 'Clear Link';
        inputActionBtn.classList.add('clear-mode');
      } else {
        actionIcon.className = 'fa-regular fa-clipboard';
        inputActionBtn.title = 'Paste Link';
        inputActionBtn.classList.remove('clear-mode');
      }
    }

    urlInput.addEventListener('input', checkInputState);

    // Paste or Clear Button Logic
    inputActionBtn.addEventListener('click', async () => {
      if (urlInput.value.trim() !== '') {
        // Clear logic
        urlInput.value = '';
        checkInputState();
        urlInput.focus();
      } else {
        // Paste logic
        try {
          const text = await navigator.clipboard.readText();
          if (text) {
            urlInput.value = text;
            checkInputState();
          }
        } catch (err) {
          showToast('Failed to access clipboard. Please paste manually.', true);
        }
      }
    });

    // Copy Full Caption Feature
    copyCaptionBtn.addEventListener('click', () => {
      if (currentTitleText) {
        navigator.clipboard.writeText(currentTitleText)
          .then(() => showToast('Full caption copied!'))
          .catch(() => showToast('Failed to copy', true));
      }
    });

    // Fetch Logic
    fetchBtn.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      if (!url) {
        showToast('Please enter a valid video link!', true);
        urlInput.focus();
        return;
      }

      // UI Loading State (Show Custom Gif & Pulse Text)
      fetchBtn.disabled = true;
      fetchBtn.innerHTML = '<i class="fa-solid fa-spinner spinner"></i> <span>Processing...</span>';
      
      // Hide result card and show loading GIF container
      resultCard.classList.remove('show');
      setTimeout(() => resultCard.style.display = 'none', 300);
      loadingCard.classList.add('show');

      try {
        // Simulating API Fetch Server Call
        const response = await fetch(`/api?url=${encodeURIComponent(url)}`);
        const data = await response.json();

        // Let the GIF show for at least slightly even if API is very fast (Better UX)
        await new Promise(resolve => setTimeout(resolve, 800));

        if (data.status === 'success' && data.video_info) {
          const info = data.video_info;
          currentTitleText = info.title || 'FTGM_Media_Video';

          mediaThumb.src = info.thumbnail || 'https://via.placeholder.com/150';
          mediaTitle.innerText = currentTitleText;

          formatsList.innerHTML = '';
          
          if (info.available_formats && info.available_formats.length > 0) {
            info.available_formats.forEach(fmt => {
              const saveBtn = document.createElement('button');
              saveBtn.className = 'btn-save';
              // Styled Format & Integrated Perfect Download Icons
              saveBtn.innerHTML = `
                <div style="display:flex; align-items:center; gap: 10px;">
                  <i class="fa-solid fa-cloud-arrow-down fa-lg"></i>
                  <span>Download (${fmt.quality})</span>
                </div>
                <span class="ext-badge">${fmt.extension.toUpperCase()}</span>
              `;

              saveBtn.addEventListener('click', () => {
                saveBtn.classList.add('preparing');
                saveBtn.innerHTML = `
                  <div style="display:flex; align-items:center; gap: 10px;">
                    <i class="fa-solid fa-spinner spinner"></i>
                    <span>Preparing...</span>
                  </div>
                  <span class="ext-badge">${fmt.extension.toUpperCase()}</span>
                `;

                window.location.href = fmt.download_url;

                setTimeout(() => {
                  saveBtn.classList.remove('preparing');
                  saveBtn.innerHTML = `
                    <div style="display:flex; align-items:center; gap: 10px;">
                      <i class="fa-solid fa-cloud-arrow-down fa-lg"></i>
                      <span>Download (${fmt.quality})</span>
                    </div>
                    <span class="ext-badge">${fmt.extension.toUpperCase()}</span>
                  `;
                }, 5000);
              });

              formatsList.appendChild(saveBtn);
            });
          } else {
            formatsList.innerHTML = '<p style="color:var(--text-muted); font-weight:500; text-align:center; margin-top:10px;">No download formats available.</p>';
          }
          
          // Toggle off Loading container, show Result
          loadingCard.classList.remove('show');
          resultCard.style.display = 'block';
          // Trigger browser reflow to animate
          void resultCard.offsetWidth;
          resultCard.classList.add('show');
          
        } else {
          loadingCard.classList.remove('show');
          showToast(data.message || 'Failed to fetch video details.', true);
        }
      } catch (err) {
        loadingCard.classList.remove('show');
        showToast('Error connecting to API server.', true);
      } finally {
        fetchBtn.disabled = false;
        fetchBtn.innerHTML = '<i class="fa-solid fa-arrow-down-long"></i> <span>Fetch Media</span>';
      }
