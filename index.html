<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIVERSAL DOWNLOADER - FTGM TOOLS</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Extra Bold Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Force ultra bold font rules across the board */
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-weight: 700;
        }

        h1, h2, h3, h4, h5, button, input, .font-extrabold {
            font-weight: 900 !important;
        }

        /* Smooth contrast transitions */
        body, div, input, button, header, footer {
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }
    </style>
</head>

<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-50 antialiased flex flex-col justify-between selection:bg-blue-600 selection:text-white">

    <!-- Header -->
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md sticky top-0 z-30">
        <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white text-lg font-black shadow-md">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <h1 class="text-xl tracking-tight text-slate-900 dark:text-white uppercase font-black">
                    UNIVERSAL <span class="text-blue-600 dark:text-blue-500">DOWNLOADER</span>
                </h1>
            </div>
            
            <span class="text-xs font-black tracking-widest text-slate-500 dark:text-slate-400 uppercase bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700">
                FTGM TOOLS
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto px-4 py-8 sm:py-12 w-full flex-1 space-y-8">

        <!-- Platform Icons -->
        <div class="flex items-center justify-center gap-4 sm:gap-6 text-2xl">
            <i class="fa-brands fa-tiktok text-[#000000] dark:text-white hover:scale-110 transition-transform" title="TikTok"></i>
            <i class="fa-brands fa-instagram text-[#E4405F] hover:scale-110 transition-transform" title="Instagram"></i>
            <i class="fa-brands fa-facebook text-[#1877F2] hover:scale-110 transition-transform" title="Facebook"></i>
            <i class="fa-brands fa-youtube text-[#FF0000] hover:scale-110 transition-transform" title="YouTube"></i>
            <i class="fa-brands fa-x-twitter text-slate-900 dark:text-slate-100 hover:scale-110 transition-transform" title="X / Twitter"></i>
            <i class="fa-brands fa-pinterest text-[#BD081C] hover:scale-110 transition-transform" title="Pinterest"></i>
        </div>

        <!-- Downloader Card -->
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 border border-slate-200 dark:border-slate-800 shadow-xl dark:shadow-2xl space-y-4">
            <form id="downloadForm" class="space-y-4">
                <div class="relative">
                    <input 
                        type="url" 
                        id="mediaUrl" 
                        placeholder="Paste link here..." 
                        required
                        class="w-full bg-slate-50 dark:bg-slate-950 border-2 border-slate-200 dark:border-slate-800 rounded-2xl px-5 py-4 text-slate-900 dark:text-white font-bold placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-blue-600 dark:focus:border-blue-500 transition-all text-base"
                    >
                    <button 
                        type="button" 
                        id="pasteBtn"
                        class="absolute right-3 top-1/2 -translate-y-1/2 px-3 py-1.5 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-xs font-black text-slate-700 dark:text-slate-300 transition-colors"
                    >
                        PASTE
                    </button>
                </div>

                <button 
                    type="submit" 
                    id="submitBtn" 
                    class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-black text-lg py-4 px-6 rounded-2xl transition-all uppercase tracking-wide shadow-lg shadow-blue-600/20 active:scale-[0.99] flex items-center justify-center space-x-2"
                >
                    <i class="fa-solid fa-download"></i>
                    <span id="btnText">DOWNLOAD</span>
                </button>
            </form>
        </div>

        <!-- Media Output Result -->
        <div id="resultsCard" class="hidden bg-white dark:bg-slate-900 rounded-3xl p-6 border border-slate-200 dark:border-slate-800 shadow-xl space-y-5">
            <div class="flex items-center space-x-4">
                <img id="mediaThumb" src="" alt="Thumbnail" class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl object-cover bg-slate-200 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex-shrink-0">
                <div class="overflow-hidden space-y-1">
                    <span id="mediaUploader" class="text-xs font-black text-blue-600 dark:text-blue-400 uppercase tracking-wider block">@UPLOADER</span>
                    <h3 id="mediaTitle" class="text-base sm:text-lg font-black text-slate-900 dark:text-white truncate">Media Title</h3>
                </div>
            </div>

            <div id="formatsList" class="space-y-2.5 border-t border-slate-100 dark:border-slate-800 pt-4">
                <!-- Download Buttons Dynamic -->
            </div>
        </div>

        <!-- Error Notification -->
        <div id="errorBox" class="hidden bg-red-50 dark:bg-red-950/40 border-2 border-red-200 dark:border-red-800/60 rounded-2xl p-5 text-center text-red-600 dark:text-red-400 font-black text-sm">
            <p id="errorMsg">Failed to fetch download link.</p>
        </div>

        <!-- WhatsApp CTA -->
        <a href="https://whatsapp.com/channel/0029VbDQFi9KmCPUDQEwVW2W" target="_blank" 
           class="block bg-emerald-500 hover:bg-emerald-600 text-slate-950 rounded-2xl p-4 sm:p-5 transition-all transform active:scale-[0.99] shadow-lg shadow-emerald-500/20">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3.5">
                    <div class="w-11 h-11 bg-slate-950 rounded-xl flex items-center justify-center text-emerald-400 text-2xl flex-shrink-0">
                        <i class="fa-brands fa-whatsapp"></i>
                    </div>
                    <div>
                        <h4 class="text-base font-black uppercase leading-tight">JOIN WHATSAPP CHANNEL</h4>
                        <p class="text-xs font-bold text-slate-950/80">Get fast updates & official releases</p>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-right text-xl"></i>
            </div>
        </a>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-6">
        <div class="max-w-3xl mx-auto px-4 text-center">
            <p class="text-xs font-black text-slate-500 dark:text-slate-400 tracking-wider uppercase">
                &copy; 2026 FTGM TOOLS. ALL RIGHTS RESERVED.
            </p>
        </div>
    </footer>

    <script>
        const downloadForm = document.getElementById('downloadForm');
        const mediaUrlInput = document.getElementById('mediaUrl');
        const pasteBtn = document.getElementById('pasteBtn');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        
        const resultsCard = document.getElementById('resultsCard');
        const mediaThumb = document.getElementById('mediaThumb');
        const mediaTitle = document.getElementById('mediaTitle');
        const mediaUploader = document.getElementById('mediaUploader');
        const formatsList = document.getElementById('formatsList');
        
        const errorBox = document.getElementById('errorBox');
        const errorMsg = document.getElementById('errorMsg');

        // Clipboard Paste
        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                if (text) mediaUrlInput.value = text;
            } catch (e) {
                mediaUrlInput.focus();
            }
        });

        // Form Submission
        downloadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = mediaUrlInput.value.trim();
            if (!url) return;

            // Reset UI
            resultsCard.classList.add('hidden');
            errorBox.classList.add('hidden');
            
            submitBtn.disabled = true;
            btnText.textContent = 'PROCESSING...';
            submitBtn.querySelector('i').className = 'fa-solid fa-circle-notch animate-spin';

            try {
                const response = await fetch(`/api?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                if (response.status === 403) {
                    showError(data.notice || "CONTACT TO BUY API : 03104882921 FTGM HACKS OFFICIAL");
                    return;
                }

                if (data.status === "error" || !data.video_info) {
                    showError(data.notice || data.message || "UNABLE TO FETCH MEDIA FORMATS.");
                    return;
                }

                renderMedia(data.video_info);

            } catch (err) {
                showError("CONTACT TO BUY API : 03104882921 FTGM HACKS OFFICIAL");
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'DOWNLOAD';
                submitBtn.querySelector('i').className = 'fa-solid fa-download';
            }
        });

        function renderMedia(info) {
            resultsCard.classList.remove('hidden');
            mediaThumb.src = info.thumbnail || 'https://placehold.co/200x200?text=No+Preview';
            mediaTitle.textContent = info.title || 'Extracted Media';
            mediaUploader.textContent = `@${info.uploader || 'FTGM_TOOLS'}`;

            formatsList.innerHTML = '';

            if (Array.isArray(info.available_formats) && info.available_formats.length > 0) {
                info.available_formats.forEach((fmt) => {
                    const isAudio = fmt.type === 'audio' || fmt.extension === 'mp3';
                    const link = document.createElement('a');
                    link.href = fmt.download_url;
                    link.target = '_blank';
                    link.download = true;
                    link.className = 'flex items-center justify-between p-3.5 rounded-xl bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-700 transition-colors group';

                    link.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid ${isAudio ? 'fa-music text-purple-600 dark:text-purple-400' : 'fa-video text-blue-600 dark:text-blue-400'} text-base"></i>
                            <div>
                                <span class="text-xs font-black text-slate-900 dark:text-white uppercase block">${fmt.quality || 'HIGH QUALITY'}</span>
                                <span class="text-[10px] font-bold text-slate-500 uppercase">${fmt.extension || 'MP4'}</span>
                            </div>
                        </div>
                        <span class="px-3.5 py-1.5 rounded-lg bg-blue-600 group-hover:bg-blue-700 text-white font-black text-xs uppercase tracking-wider">
                            SAVE
                        </span>
                    `;
                    formatsList.appendChild(link);
                });
            } else {
                formatsList.innerHTML = `<p class="text-xs font-black text-slate-500 uppercase">NO FORMATS AVAILABLE.</p>`;
            }

            resultsCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function showError(message) {
            errorMsg.textContent = message;
            errorBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
