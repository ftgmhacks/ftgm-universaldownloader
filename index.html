<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FTGM Universal Media Downloader</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- System Fonts Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
      --radius: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0b0f17;
        --card-bg: #151c28;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: #232d3f;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.35);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 16px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    /* Header & Branding */
    header {
      text-align: center;
      margin-top: 20px;
      margin-bottom: 24px;
    }

    .brand-title {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: var(--text-main);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .brand-title span {
      color: var(--accent);
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Platform Icons Grid */
    .platforms {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .platform-chip {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      font-size: 1.3rem;
      transition: transform 0.2s ease;
    }

    .platform-chip:hover {
      transform: translateY(-2px);
    }

    .icon-tiktok { color: #fe2c55; }
    .icon-instagram { color: #e1306c; }
    .icon-facebook { color: #1877f2; }
    .icon-youtube { color: #ff0000; }

    /* Input Box */
    .input-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 8px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .input-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .input-field {
      width: 100%;
      padding: 14px 44px 14px 42px;
      background: transparent;
      border: none;
      outline: none;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .input-field::placeholder {
      color: var(--text-muted);
      font-weight: 500;
    }

    .btn-action-input {
      position: absolute;
      right: 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 6px;
      border-radius: 8px;
      transition: color 0.2s ease, background-color 0.2s ease;
    }

    .btn-action-input:hover {
      color: var(--danger);
      background-color: rgba(220, 38, 38, 0.1);
    }

    .btn-fetch {
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s ease;
      white-space: nowrap;
    }

    .btn-fetch:hover {
      background: var(--accent-hover);
    }

    /* Result Card */
    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      display: none;
    }

    .media-preview-container {
      display: flex;
      gap: 16px;
      margin-bottom: 18px;
      align-items: flex-start;
    }

    .media-thumb {
      width: 110px;
      height: 110px;
      border-radius: 12px;
      object-fit: cover;
      background: var(--border-color);
      flex-shrink: 0;
    }

    .media-info {
      flex: 1;
      overflow: hidden;
    }

    .media-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.35;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .btn-copy-caption {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-copy-caption:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    .formats-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-save {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }

    .btn-save:hover {
      background: var(--accent-hover);
    }

    .btn-save.preparing {
      background: var(--text-muted);
      cursor: wait;
      pointer-events: none;
    }

    /* WhatsApp Banner */
    .whatsapp-card {
      background: #00a884;
      color: #ffffff;
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(0, 168, 132, 0.2);
      margin-bottom: 30px;
      transition: transform 0.2s ease;
    }

    .whatsapp-card:hover {
      transform: translateY(-2px);
    }

    .wa-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .wa-icon {
      font-size: 1.8rem;
    }

    .wa-text h4 {
      font-size: 0.95rem;
      font-weight: 800;
    }

    .wa-text p {
      font-size: 0.8rem;
      opacity: 0.9;
      font-weight: 600;
    }

    .wa-arrow {
      font-size: 1.2rem;
    }

    /* Notification Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0f172a;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 16px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      width: 100%;
    }

    /* Spinner */
    .spinner {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <h1 class="brand-title">FTGM <span>DOWNLOADER</span></h1>
      <p class="subtitle">Download High-Quality Videos Fast & Free</p>
    </header>

    <!-- Platform Icons -->
    <div class="platforms">
      <div class="platform-chip"><i class="fa-brands fa-tiktok icon-tiktok"></i></div>
      <div class="platform-chip"><i class="fa-brands fa-instagram icon-instagram"></i></div>
      <div class="platform-chip"><i class="fa-brands fa-facebook icon-facebook"></i></div>
      <div class="platform-chip"><i class="fa-brands fa-youtube icon-youtube"></i></div>
    </div>

    <!-- Input Card -->
    <div class="input-card">
      <div class="input-wrapper">
        <i class="fa-solid fa-link"></i>
        <input type="text" id="urlInput" class="input-field" placeholder="Paste media link here..." autocomplete="off">
        <button id="inputActionBtn" class="btn-action-input" title="Paste Link">
          <i class="fa-regular fa-clipboard" id="actionIcon"></i>
        </button>
      </div>
      <button id="fetchBtn" class="btn-fetch">
        <i class="fa-solid fa-arrow-down-long"></i>
        <span>Fetch</span>
      </button>
    </div>

    <!-- Result Card -->
    <div id="resultCard" class="result-card">
      <div class="media-preview-container">
        <img id="mediaThumb" class="media-thumb" src="" alt="Thumbnail">
        <div class="media-info">
          <h2 id="mediaTitle" class="media-title"></h2>
          <button id="copyCaptionBtn" class="btn-copy-caption">
            <i class="fa-regular fa-copy"></i> Copy Caption
          </button>
        </div>
      </div>
      <div id="formatsList" class="formats-list"></div>
    </div>

    <!-- WhatsApp CTA -->
    <a href="https://whatsapp.com/channel/0029VbDQFi9KmCPUDQEwVW2W" target="_blank" class="whatsapp-card">
      <div class="wa-content">
        <i class="fa-brands fa-whatsapp wa-icon"></i>
        <div class="wa-text">
          <h4>Join Official WhatsApp Channel</h4>
          <p>Get instant updates & exclusive tools</p>
        </div>
      </div>
      <i class="fa-solid fa-chevron-right wa-arrow"></i>
    </a>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast">Caption Copied!</div>

  <!-- Footer -->
  <footer>
    FTGM TOOLS &copy; 2026. All rights reserved.
  </footer>

  <script>
    const urlInput = document.getElementById('urlInput');
    const inputActionBtn = document.getElementById('inputActionBtn');
    const actionIcon = document.getElementById('actionIcon');
    const fetchBtn = document.getElementById('fetchBtn');
    const resultCard = document.getElementById('resultCard');
    const mediaThumb = document.getElementById('mediaThumb');
    const mediaTitle = document.getElementById('mediaTitle');
    const copyCaptionBtn = document.getElementById('copyCaptionBtn');
    const formatsList = document.getElementById('formatsList');
    const toast = document.getElementById('toast');

    let currentTitleText = '';

    // Show Toast
    function showToast(msg) {
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Toggle Paste / Clear Button
    urlInput.addEventListener('input', () => {
      if (urlInput.value.trim() !== '') {
        actionIcon.className = 'fa-solid fa-xmark';
        inputActionBtn.title = 'Clear Link';
      } else {
        actionIcon.className = 'fa-regular fa-clipboard';
        inputActionBtn.title = 'Paste Link';
      }
    });

    // Action Button Click (Paste or Clear)
    inputActionBtn.addEventListener('click', async () => {
      if (urlInput.value.trim() !== '') {
        urlInput.value = '';
        actionIcon.className = 'fa-regular fa-clipboard';
        inputActionBtn.title = 'Paste Link';
        urlInput.focus();
      } else {
        try {
          const text = await navigator.clipboard.readText();
          if (text) {
            urlInput.value = text;
            actionIcon.className = 'fa-solid fa-xmark';
            inputActionBtn.title = 'Clear Link';
          }
        } catch (err) {
          showToast('Failed to access clipboard');
        }
      }
    });

    // Copy Caption Action
    copyCaptionBtn.addEventListener('click', () => {
      if (currentTitleText) {
        navigator.clipboard.writeText(currentTitleText);
        showToast('Caption copied to clipboard!');
      }
    });

    // Fetch Video Details
    fetchBtn.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      if (!url) {
        showToast('Please enter a valid video link!');
        return;
      }

      // UI Loading State
      fetchBtn.disabled = true;
      fetchBtn.innerHTML = '<i class="fa-solid fa-spinner spinner"></i> Processing...';
      resultCard.style.display = 'none';

      try {
        const response = await fetch(`/api?url=${encodeURIComponent(url)}`);
        const data = await response.json();

        if (data.status === 'success' && data.video_info) {
          const info = data.video_info;
          currentTitleText = info.title || 'FTGM_Media_Video';

          mediaThumb.src = info.thumbnail || 'https://via.placeholder.com/150';
          mediaTitle.innerText = currentTitleText;

          formatsList.innerHTML = '';
          
          if (info.available_formats && info.available_formats.length > 0) {
            info.available_formats.forEach(fmt => {
              const saveBtn = document.createElement('button');
              saveBtn.className = 'btn-save';
              saveBtn.innerHTML = `
                <span><i class="fa-solid fa-download"></i> Save (${fmt.quality})</span>
                <span>${fmt.extension.toUpperCase()}</span>
              `;

              saveBtn.addEventListener('click', () => {
                // Change state to "Preparing..."
                saveBtn.classList.add('preparing');
                saveBtn.innerHTML = `
                  <span><i class="fa-solid fa-spinner spinner"></i> Preparing...</span>
                  <span>${fmt.extension.toUpperCase()}</span>
                `;

                // Trigger Download
                window.location.href = fmt.download_url;

                // Reset button after 5 seconds
                setTimeout(() => {
                  saveBtn.classList.remove('preparing');
                  saveBtn.innerHTML = `
                    <span><i class="fa-solid fa-download"></i> Save (${fmt.quality})</span>
                    <span>${fmt.extension.toUpperCase()}</span>
                  `;
                }, 5000);
              });

              formatsList.appendChild(saveBtn);
            });
          } else {
            formatsList.innerHTML = '<p style="color:var(--text-muted); font-weight:600;">No download formats available.</p>';
          }

          resultCard.style.display = 'block';
        } else {
          showToast(data.message || 'Failed to fetch video details.');
        }
      } catch (err) {
        showToast('Error connecting to API server.');
      } finally {
        fetchBtn.disabled = false;
        fetchBtn.innerHTML = '<i class="fa-solid fa-arrow-down-long"></i> Fetch';
      }
    });
  </script>
</body>
</html>
